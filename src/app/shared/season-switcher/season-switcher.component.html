<div class="season-switcher">
  <button
    type="button"
    class="season-nav-btn"
    (click)="previous()"
    [disabled]="!canGoPrevious"
    aria-label="Saison précédente"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
  </button>

  <span class="season-switcher-label">{{ currentLabel }}</span>

  <button
    type="button"
    class="season-nav-btn"
    (click)="next()"
    [disabled]="!canGoNext"
    aria-label="Saison suivante"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
  </button>
</div>
