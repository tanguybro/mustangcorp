<div class="ranking-container">
  <header class="ranking-header">
    <h1>Classement</h1>
    <p>Saison 1</p>
  </header>

  <ng-container *ngIf="{ 
    users: rankedUsers$ | async, 
    me: currentUser$ | async 
  } as data; else loading">
  
    <div class="ranking-list" *ngIf="data.users && data.users.length > 0; else noUsers">
      <div class="user-row" 
           *ngFor="let user of data.users" 
           [class.is-current-user]="user.id === data.me?.email">
        
        <div class="user-position">
          <span *ngIf="user.rank === 1" class="medal gold">🥇</span>
          <span *ngIf="user.rank === 2" class="medal silver">🥈</span>
          <span *ngIf="user.rank === 3" class="medal bronze">🥉</span>
          <span *ngIf="user.rank > 3">{{ user.rank }}</span>
        </div>
  
        <div class="user-name">
          {{ user.Nom }}
        </div>
  
        <div class="user-score">{{ user.Points }} Points</div>
      </div>
    </div>
  
  </ng-container>

  <ng-template #loading>
    <p class="info-text">Chargement du classement...</p>
  </ng-template>

  <ng-template #noUsers>
    <p class="info-text">
      Aucun utilisateur dans le classement pour le moment.
    </p>
  </ng-template>
</div>
