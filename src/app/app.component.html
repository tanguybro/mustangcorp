<!-- NOUVEAU : En-tête de l'application -->
<header class="app-header">
<div class="header-brand">
  <img src="assets/icon.png" alt="Mustang Club Logo" class="header-logo">
  <span class="header-title">Mustang Club</span>
</div>

<!-- Cette section s'affiche uniquement si un profil utilisateur est chargé -->
<div class="header-user-info" *ngIf="userProfile$ | async as profile">
  <span class="mtc-balance">{{ profile.Solde || 0 }} €</span>
</div>
</header>

<div class="update-banner" *ngIf="updateAvailable" (click)="reloadForUpdate()">
  Nouvelle version disponible — appuyer pour actualiser
</div>

<!-- Le contenu de votre page s'affichera ici -->
<main class="main-content">
<router-outlet></router-outlet>
</main>

<!-- Barre de navigation fixe, style application -->
<nav class="app-nav">
