<div class="faq-container">
  <header class="faq-header">
    <h1>FAQ</h1>
  </header>

  <div class="faq-list">
    <div class="faq-item" *ngFor="let item of faqList">
      <h2 class="faq-question">{{ item.question }}</h2>
      <p class="faq-answer">{{ item.answer }}</p>
    </div>
  </div>
</div>
